<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berlin - Qena | برلين قنا</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Marcellus&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap');

:root{
  --cream:#F9F5EC;
  --cream-soft:#F3ECDD;
  --espresso:#4A2C11;
  --espresso-deep:#301B0A;
  --gold:#D4AF37;
  --gold-soft:#E8CB6B;
  --white:#FFFDF8;
  --shadow:rgba(74,44,17,0.18);
  --radius:18px;
  --serif:'Playfair Display', 'Marcellus', serif;
  --arabic:'Cairo', sans-serif;
}

body.dark-mode{
  --cream:#1C140B;
  --cream-soft:#241A0F;
  --espresso:#F3E7D3;
  --espresso-deep:#FFFFFF;
  --gold:#D4AF37;
  --gold-soft:#E8CB6B;
  --white:#2A1F13;
  --shadow:rgba(0,0,0,0.45);
}
body.dark-mode .skyline-bg{ opacity:0.12; }
body.dark-mode .skyline-bg svg g{ fill:#D4AF37; }
body.dark-mode .menu-header{ background:rgba(28,20,11,0.92); }
body.dark-mode .splash-logo-wrap{ background:var(--espresso); }
body.dark-mode .top-logo img,
body.dark-mode .mh-brand img,
body.dark-mode .brand-logo-lg img{ background:var(--espresso); }
body.dark-mode .item-price{ background:rgba(212,175,55,0.14); }

body{ transition:background 0.4s ease, color 0.4s ease; }
.menu-header, .item-card, .category-card, .tab-btn, .lang-btn, .search-bar, .item-price, .top-logo, .mh-lang{
  transition:background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}

.theme-toggle{
  position:absolute; top:20px;
  inset-inline-start:20px;
  width:40px; height:40px;
  border-radius:50%;
  background:var(--cream-soft);
  border:1px solid rgba(212,175,55,0.4);
  display:flex; align-items:center; justify-content:center;
  font-size:17px;
  z-index:5;
}
.mh-theme-toggle{
  width:36px; height:36px;
  border-radius:50%;
  background:var(--cream-soft);
  border:1px solid rgba(212,175,55,0.4);
  display:flex; align-items:center; justify-content:center;
  font-size:15px;
  flex-shrink:0;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  height:100%;
  background:var(--cream);
  color:var(--espresso);
  font-family:var(--arabic);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

body.lang-en{ direction:ltr; }
body.lang-en [dir-auto]{ direction:ltr; }

img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}

.screen{
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:none;
  flex-direction:column;
}
.screen.active{display:flex;}

/* ---------- Decorative Berlin skyline watermark ---------- */
.skyline-bg{
  position:fixed;
  bottom:0; left:0; right:0;
  height:110px;
  opacity:0.07;
  background-repeat:repeat-x;
  background-position:bottom center;
  background-size:auto 100%;
  pointer-events:none;
  z-index:0;
}
.skyline-bg svg{width:100%;height:100%;}

/* ================= SPLASH ================= */
#splash{
  position:fixed; inset:0;
  background:linear-gradient(160deg, var(--espresso-deep) 0%, var(--espresso) 55%, #5c3818 100%);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  z-index:9999;
  transition:opacity 0.9s ease, transform 0.9s ease;
}
#splash.fade-out{
  opacity:0;
  transform:scale(1.08);
  pointer-events:none;
}
.splash-logo-wrap{
  width:190px; height:190px;
  border-radius:50%;
  background:var(--cream);
  display:flex; align-items:center; justify-content:center;
  padding:18px;
  box-shadow:0 0 0 1px rgba(212,175,55,0.5), 0 20px 60px rgba(0,0,0,0.45);
  animation:splashPop 1.1s cubic-bezier(.2,.9,.25,1) both;
}
.splash-logo-wrap img{width:100%; height:100%; object-fit:contain; border-radius:50%;}
@keyframes splashPop{
  0%{opacity:0; transform:scale(0.6);}
  60%{opacity:1; transform:scale(1.06);}
  100%{opacity:1; transform:scale(1);}
}
.splash-tagline{
  margin-top:26px;
  color:var(--gold-soft);
  letter-spacing:0.35em;
  font-size:12px;
  font-family:var(--serif);
  text-transform:uppercase;
  opacity:0;
  animation:fadeUp 1s ease 0.5s forwards;
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}
.splash-loader{
  margin-top:34px;
  width:150px; height:2px;
  background:rgba(212,175,55,0.25);
  border-radius:2px;
  overflow:hidden;
}
.splash-loader::after{
  content:'';
  display:block;
  width:40%; height:100%;
  background:var(--gold);
  border-radius:2px;
  animation:loaderSlide 1.4s ease-in-out infinite;
}
@keyframes loaderSlide{
  0%{transform:translateX(-100%);}
  100%{transform:translateX(350%);}
}

/* ================= LANGUAGE SCREEN ================= */
#screen-lang{
  align-items:center; justify-content:center;
  padding:32px 24px;
  position:relative;
  background:radial-gradient(circle at 50% 0%, var(--cream-soft) 0%, var(--cream) 60%);
}
.lang-inner{
  width:100%; max-width:460px;
  text-align:center;
  z-index:1;
  animation:fadeUp 0.8s ease both;
}
.brand-logo-lg{
  width:150px; height:150px;
  margin:0 auto 18px;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 14px 40px var(--shadow);
  border:2px solid var(--gold);
}
.brand-logo-lg img{width:100%; height:100%; object-fit:contain; background:var(--cream);}
.brand-est{
  font-family:var(--serif);
  letter-spacing:0.3em;
  font-size:11px;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:6px;
}
.lang-title{
  font-family:var(--serif);
  font-size:15px;
  color:var(--espresso);
  opacity:0.75;
  margin-bottom:34px;
}
.lang-options{
  display:flex; flex-direction:column; gap:16px;
}
.lang-btn{
  border:1.5px solid var(--espresso);
  background:transparent;
  color:var(--espresso);
  border-radius:100px;
  padding:18px 28px;
  font-size:19px;
  font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:12px;
  transition:all 0.35s ease;
  position:relative;
  overflow:hidden;
}
.lang-btn .flag{font-size:22px;}
.lang-btn:active{transform:scale(0.97);}
.lang-btn:hover{
  background:var(--espresso);
  color:var(--cream);
  box-shadow:0 10px 30px var(--shadow);
}
.lang-btn.primary{
  background:var(--espresso);
  color:var(--cream);
}
.lang-btn.primary:hover{
  background:var(--espresso-deep);
}

/* ================= CATEGORY (Food/Drinks) SCREEN ================= */
#screen-main{
  align-items:center;
  padding:0;
  position:relative;
}
.main-top{
  width:100%;
  padding:38px 24px 18px;
  text-align:center;
  z-index:1;
}
.top-logo{
  width:78px; height:78px;
  margin:0 auto 12px;
  border-radius:50%;
  overflow:hidden;
  border:1.5px solid var(--gold);
}
.top-logo img{width:100%;height:100%;object-fit:contain;background:var(--cream);}
.main-welcome{
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:4px;
}
.main-title{
  font-family:var(--serif);
  font-size:26px;
  color:var(--espresso);
}
.lang-switch-mini{
  position:absolute; top:20px;
  inset-inline-end:20px;
  background:var(--cream-soft);
  border:1px solid rgba(74,44,17,0.15);
  border-radius:100px;
  padding:8px 16px;
  font-size:13px;
  font-weight:700;
  color:var(--espresso);
  z-index:2;
}

.category-grid{
  flex:1;
  width:100%;
  max-width:520px;
  padding:20px 24px 40px;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:1;
  justify-content:center;
}
.category-card{
  background:var(--white);
  border:1px solid rgba(212,175,55,0.35);
  border-radius:var(--radius);
  padding:30px 24px;
  display:flex;
  align-items:center;
  gap:20px;
  box-shadow:0 10px 26px var(--shadow);
  transition:transform 0.35s ease, box-shadow 0.35s ease;
  animation:fadeUp 0.7s ease both;
}
.category-card:nth-child(2){animation-delay:0.12s;}
.category-card:active{transform:scale(0.98);}
.category-card:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 40px var(--shadow);
}
.category-card .cat-icon{
  width:62px; height:62px;
  border-radius:50%;
  background:linear-gradient(145deg, var(--cream-soft), var(--cream));
  display:flex; align-items:center; justify-content:center;
  font-size:30px;
  flex-shrink:0;
  border:1px solid rgba(212,175,55,0.4);
}
.category-card .cat-text{
  text-align:start;
  flex:1;
}
.category-card .cat-text h3{
  font-family:var(--serif);
  font-size:21px;
  color:var(--espresso);
  margin-bottom:4px;
}
.category-card .cat-text p{
  font-size:12.5px;
  color:var(--espresso);
  opacity:0.6;
}
.category-card .cat-arrow{
  font-size:20px;
  color:var(--gold);
  flex-shrink:0;
}

.back-link{
  margin-top:6px;
  font-size:13px;
  color:var(--espresso);
  opacity:0.55;
  text-decoration:underline;
  background:none;
  border:none;
}

/* ================= MENU SCREEN ================= */
#screen-menu{
  align-items:stretch;
}
.menu-header{
  position:sticky; top:0; z-index:50;
  background:rgba(249,245,236,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(212,175,55,0.35);
  padding:14px 16px 0;
}
.menu-header-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.mh-back{
  display:flex; align-items:center; gap:8px;
  background:none; border:none;
  color:var(--espresso);
  font-weight:700;
  font-size:14px;
}
.mh-back .arrow-ico{font-size:18px; color:var(--gold);}
.mh-brand{
  display:flex; align-items:center; gap:8px;
}
.mh-brand img{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);}
.mh-brand span{font-family:var(--serif); font-weight:700; font-size:15px;}
.mh-lang{
  background:var(--cream-soft);
  border:1px solid rgba(74,44,17,0.15);
  border-radius:100px;
  padding:6px 14px;
  font-size:12.5px;
  font-weight:700;
  color:var(--espresso);
}

.search-bar-wrap{
  padding-bottom:12px;
}
.search-bar{
  display:flex; align-items:center; gap:10px;
  background:var(--white);
  border:1px solid rgba(74,44,17,0.15);
  border-radius:100px;
  padding:11px 18px;
}
.search-bar input{
  border:none; outline:none; background:transparent;
  flex:1;
  font-family:inherit;
  font-size:14.5px;
  color:var(--espresso);
}
.search-bar input::placeholder{color:rgba(74,44,17,0.45);}
.search-bar .search-ico{color:var(--gold); font-size:16px;}

.tabs-scroll{
  display:flex; gap:8px;
  overflow-x:auto;
  padding:0 0 14px;
  scrollbar-width:none;
}
.tabs-scroll::-webkit-scrollbar{display:none;}
.tab-btn{
  flex-shrink:0;
  border:1px solid rgba(74,44,17,0.2);
  background:var(--white);
  color:var(--espresso);
  border-radius:100px;
  padding:9px 18px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:all 0.3s ease;
  display:flex; align-items:center; gap:6px;
}
.tab-btn .tab-emoji{font-size:14px;}
.tab-btn.active{
  background:var(--espresso);
  color:var(--cream);
  border-color:var(--espresso);
  box-shadow:0 6px 16px var(--shadow);
}

.items-wrap{
  flex:1;
  padding:18px 16px 60px;
  max-width:900px;
  width:100%;
  margin:0 auto;
  z-index:1;
}
.section-heading{
  font-family:var(--serif);
  font-size:19px;
  color:var(--espresso);
  margin:22px 4px 12px;
  padding-bottom:8px;
  border-bottom:1px solid rgba(212,175,55,0.4);
  display:flex; align-items:center; gap:8px;
}
.section-heading:first-child{margin-top:2px;}

.items-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
@media(min-width:640px){
  .items-grid{grid-template-columns:1fr 1fr;}
}

.item-card{
  background:var(--white);
  border:1px solid rgba(212,175,55,0.28);
  border-radius:14px;
  padding:16px 18px;
  position:relative;
  box-shadow:0 6px 16px rgba(74,44,17,0.08);
  transition:transform 0.3s ease, box-shadow 0.3s ease;
  opacity:0;
  animation:cardIn 0.5s ease forwards;
}
@keyframes cardIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
.item-card:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 30px rgba(74,44,17,0.16);
  border-color:var(--gold);
}
.item-top{
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  margin-bottom:6px;
}
.item-name{
  font-family:var(--serif);
  font-size:16.5px;
  color:var(--espresso);
  font-weight:700;
  line-height:1.35;
}
.item-price{
  font-weight:800;
  font-size:15px;
  color:var(--espresso);
  white-space:nowrap;
  flex-shrink:0;
  background:var(--cream-soft);
  padding:4px 11px;
  border-radius:100px;
  border:1px solid rgba(212,175,55,0.4);
}
.item-desc{
  font-size:12.8px;
  color:var(--espresso);
  opacity:0.68;
  line-height:1.6;
}
.item-badge{
  display:inline-flex; align-items:center; gap:4px;
  margin-top:9px;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:0.03em;
  padding:4px 10px;
  border-radius:100px;
  background:linear-gradient(120deg, var(--gold), var(--gold-soft));
  color:var(--espresso-deep);
}
.item-badge.popular{
  background:linear-gradient(120deg,#7a4a1c,#a3672c);
  color:var(--cream);
}

.no-results{
  text-align:center;
  padding:60px 20px;
  color:var(--espresso);
  opacity:0.55;
  font-size:14px;
}

/* Fade-slide transition for switching screens/sections */
.fade-slide-enter{
  animation:fadeSlideIn 0.45s ease both;
}
@keyframes fadeSlideIn{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:translateY(0);}
}

::selection{background:var(--gold); color:var(--espresso-deep);}

@media(max-width:380px){
  .lang-btn{font-size:17px; padding:16px 22px;}
  .main-title{font-size:22px;}
}

/* Berlin enhancement layer */
.card-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}.review-stars{color:var(--gold);font-size:13px;letter-spacing:1px}.review-count{font-size:11px;opacity:.72}.review-btn{border:1px solid rgba(212,175,55,.45);background:transparent;color:var(--espresso);border-radius:10px;padding:7px 9px;font:inherit;font-size:11px;cursor:pointer}
</style>
</head>

let STATE = {
  lang: 'ar',
  section: null, // 'food' | 'drinks'
  activeTab: 'all',
  theme: 'light',
};

function applyThemeIcons(){
  const icon = STATE.theme === 'dark' ? '☀️' : '🌙';
  ['themeToggleLang','themeToggleMain','themeToggleMenu'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = icon;
  });
}

function toggleTheme(){
  STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
  document.body.classList.toggle('dark-mode', STATE.theme === 'dark');
  applyThemeIcons();
  try{ localStorage.setItem('berlinMenuTheme', STATE.theme); }catch(e){}
}

function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('berlinMenuTheme'); }catch(e){}
  if(!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    saved = 'dark';
  }
  if(saved === 'dark'){
    STATE.theme = 'dark';
    document.body.classList.add('dark-mode');
  }
  applyThemeIcons();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  el.classList.remove('fade-slide-enter');
  void el.offsetWidth;
  el.classList.add('fade-slide-enter');
  window.scrollTo(0,0);
}

function setLanguage(lang){
  STATE.lang = lang;
  document.body.classList.remove('lang-en','lang-ar');
  document.body.classList.add(lang === 'en' ? 'lang-en' : 'lang-ar');
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
  applyStaticText();
  showScreen('screen-main');
}

function goToLang(){
  showScreen('screen-lang');
}

function applyStaticText(){
  const t = T[STATE.lang];
  document.getElementById('mainWelcome').textContent = t.welcome;
  document.getElementById('mainTitle').textContent = t.title;
  document.getElementById('catFoodTitle').textContent = t.foodTitle;
  document.getElementById('catFoodDesc').textContent = t.foodDesc;
  document.getElementById('catDrinksTitle').textContent = t.drinksTitle;
  document.getElementById('catDrinksDesc').textContent = t.drinksDesc;
  document.getElementById('mainLangSwitch').textContent = t.langSwitch;
  document.getElementById('mhLangSwitch').textContent = t.langSwitch;
  document.getElementById('mhBackLabel').textContent = t.backHome;
  document.getElementById('searchInput').placeholder = t.searchPh;
  const arrow = STATE.lang === 'en' ? '›' : '‹';
  const backArrow = STATE.lang === 'en' ? '‹' : '›';
  document.getElementById('catFoodArrow').textContent = arrow;
  document.getElementById('catDrinksArrow').textContent = arrow;
  document.getElementById('mhBackArrow').textContent = backArrow;
}

function openSection(section){
  STATE.section = section;
  STATE.activeTab = 'all';
  document.getElementById('searchInput').value = '';
  buildTabs();
  renderItems();
  showScreen('screen-menu');
}

function backToMain(){
  showScreen('screen-main');
}

function buildTabs(){
  const t = T[STATE.lang];
  const cats = STATE.section === 'food' ? MENU_DATA.food_categories : MENU_DATA.drink_categories;
  const wrap = document.getElementById('tabsScroll');
  wrap.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab-btn active';
  allBtn.dataset.cat = 'all';
  allBtn.innerHTML = `<span class="tab-emoji">✨</span> ${t.all}`;
  allBtn.onclick = ()=>selectTab('all');
  wrap.appendChild(allBtn);
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab-btn';
    b.dataset.cat = c.id;
    b.innerHTML = `<span class="tab-emoji">${c.icon}</span> ${STATE.lang==='ar'?c.ar:c.en}`;
    b.onclick = ()=>selectTab(c.id);
    wrap.appendChild(b);
  });
}

function selectTab(catId){
  STATE.activeTab = catId;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat === catId);
  });
  const activeBtn = document.querySelector('.tab-btn.active');
  if(activeBtn) activeBtn.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  renderItems();
}

function renderItems(){
  const t = T[STATE.lang];
  const cats = STATE.section === 'food' ? MENU_DATA.food_categories : MENU_DATA.drink_categories;
  const catIds = cats.map(c=>c.id);
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  let filtered = MENU_DATA.items.filter(it => catIds.includes(it.cat));
  if(STATE.activeTab !== 'all'){
    filtered = filtered.filter(it => it.cat === STATE.activeTab);
  }
  if(query){
    filtered = filtered.filter(it =>
      it.name_ar.toLowerCase().includes(query) ||
      it.name_en.toLowerCase().includes(query) ||
      (it.desc_ar||'').toLowerCase().includes(query) ||
      (it.desc_en||'').toLowerCase().includes(query)
    );
  }

  const wrap = document.getElementById('itemsWrap');
  wrap.innerHTML = '';

  if(filtered.length === 0){
    const noRes = document.createElement('div');
    noRes.className = 'no-results';
    noRes.textContent = t.noResults;
    wrap.appendChild(noRes);
    return;
  }

  // group by category for display when "All" is selected or search spans categories
  const groups = {};
  filtered.forEach(it=>{
    if(!groups[it.cat]) groups[it.cat] = [];
    groups[it.cat].push(it);
  });

  const orderedCatIds = catIds.filter(id => groups[id]);

  orderedCatIds.forEach(catId=>{
    const catObj = cats.find(c=>c.id===catId);
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.innerHTML = `<span>${catObj.icon}</span><span>${STATE.lang==='ar'?catObj.ar:catObj.en}</span>`;
    wrap.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'items-grid';

    groups[catId].forEach((it, idx)=>{
      const card = document.createElement('div');
      card.className = 'item-card';
      card.style.animationDelay = (idx * 0.03) + 's';
      const name = STATE.lang==='ar' ? it.name_ar : (it.name_en || it.name_ar);
      const desc = STATE.lang==='ar' ? it.desc_ar : (it.desc_en || it.desc_ar);
      let badgeHtml = '';
      if(it.badge === 'special'){
        badgeHtml = `<div class="item-badge">★ ${t.special}</div>`;
      } else if(it.badge === 'popular'){
        badgeHtml = `<div class="item-badge popular">🔥 ${t.popular}</div>`;
      }
      card.innerHTML = `
        <div class="item-top">
          <div class="item-name">${name}</div>
          <div class="item-price">${it.price} ${t.egp}</div>
        </div>
        ${desc ? `<div class="item-desc">${desc}</div>` : ''}
        ${badgeHtml}<div class="card-tools"><span class="review-stars" id="stars-${it.id}">★★★★★</span><span class="review-count">تقييم العملاء</span><button class="review-btn" onclick="event.stopPropagation();openReview('${it.id}')">قيّم</button></div>
      `;
      grid.appendChild(card);
    });

    wrap.appendChild(grid);
  });
}


const CUSTOMER_REVIEWS_KEY='berlinCustomerReviewsV1';let activeReviewId=null,activeReviewStars=5;
function getReviews(){try{return JSON.parse(localStorage.getItem(CUSTOMER_REVIEWS_KEY)||'{}')}catch(e){return {}}}
function openReview(id){activeReviewId=id;activeReviewStars=5;const it=MENU_DATA.items.find(x=>x.id===id);document.getElementById('reviewProduct').textContent=STATE.lang==='ar'?it.name_ar:it.name_en;const wrap=document.getElementById('reviewStars');wrap.innerHTML='';for(let n=1;n<=5;n++){const b=document.createElement('button');b.textContent='★';b.className=n<=activeReviewStars?'active':'';b.onclick=()=>{activeReviewStars=n;[...wrap.children].forEach((x,i)=>x.classList.toggle('active',i<n))};wrap.appendChild(b)}document.getElementById('reviewText').value='';document.getElementById('reviewModal').style.display='grid'}
function closeReview(){document.getElementById('reviewModal').style.display='none'}
function saveReview(){const text=document.getElementById('reviewText').value.trim();if(!text){document.getElementById('reviewText').focus();return}const all=getReviews();all[activeReviewId]=all[activeReviewId]||[];all[activeReviewId].push({stars:activeReviewStars,text,at:Date.now()});localStorage.setItem(CUSTOMER_REVIEWS_KEY,JSON.stringify(all));closeReview()}
// Splash screen timing
window.addEventListener('load', ()=>{
  initTheme();
  setTimeout(()=>{
    document.getElementById('splash').classList.add('fade-out');
    setTimeout(()=>{
      document.getElementById('splash').style.display = 'none';
      showScreen('screen-lang');
    }, 900);
  }, 1800);
});
</script>
<div id="reviewModal" class="review-modal" style="display:none"><div class="review-box"><h3 id="reviewHeading">قيّم هذا الطبق</h3><div id="reviewProduct"></div><div class="review-stars-picker" id="reviewStars"></div><textarea id="reviewText" placeholder="اكتب رأيك"></textarea><div class="review-actions"><button onclick="saveReview()" id="reviewSave">حفظ التقييم</button><button class="cancel" onclick="closeReview()" id="reviewCancel">إلغاء</button></div></div></div></body>
